name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME is preset).
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PlayTime.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTime-apk
          path: PlayTime.apk

      # On the main branch, also publish a "latest" release so the APK can be
      # downloaded straight from the phone's browser.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Play Time (latest)
          prerelease: false
          make_latest: true
          files: PlayTime.apk
