name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Empty until the parent adds the secret; the releases-repo step checks it.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME is preset).
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PlayTime.apk

      # Fails the job if the APK isn't properly signed or can't be read, and logs
      # the package name, SDK levels and signing certificate.
      - name: Verify APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in PlayTime*.apk; do
            echo "=== $apk"
            "$BT/apksigner" verify --verbose --print-certs "$apk"
            "$BT/aapt2" dump badging "$apk" | head -20
            if "$BT/aapt2" dump badging "$apk" | grep -q testOnly; then
              echo "$apk is marked testOnly and would not install"; exit 1
            fi
            # Phones block sideloaded apps that declare an Accessibility Service.
            if "$BT/aapt2" dump badging "$apk" | grep -q "provides-component:'accessibility'"; then
              echo "$apk declares an Accessibility Service and will be refused by the phone"; exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTime-apk
          path: PlayTime.apk

      # Publish a "latest" release so the APK can be downloaded straight from the
      # phone's browser (no zip).
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-3cd5d074-7tlkgj'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Play Time (latest)
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: "Built from ${{ github.ref_name }} @ ${{ github.sha }}"
          files: PlayTime.apk

      # Friends' phones: copy the APK to the public releases-only repo, where the app's
      # "Update app" button downloads it. Skipped until the RELEASES_TOKEN secret exists.
      # GitHub can't publish a release in an empty repository: add a README the first time.
      - name: Make sure play-time-releases has a first file
        if: env.RELEASES_TOKEN != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-3cd5d074-7tlkgj')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ! gh api repos/mckogan2/play-time-releases/contents/README.md > /dev/null 2>&1; then
            printf '# Play Time releases\n\nNew versions of the Play Time app. In the app: Parents → Settings → Update app.\n' > releases-readme.md
            gh api -X PUT repos/mckogan2/play-time-releases/contents/README.md \
              -f message="Add README" \
              -f content="$(base64 -w0 releases-readme.md)"
          fi

      - name: Publish to play-time-releases
        if: env.RELEASES_TOKEN != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-3cd5d074-7tlkgj')
        uses: softprops/action-gh-release@v2
        with:
          repository: mckogan2/play-time-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          name: Play Time 1.0.${{ github.run_number }}
          make_latest: true
          files: PlayTime.apk
