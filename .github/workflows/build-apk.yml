name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME is preset).
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullRelease assembleFullDebug assembleNoguardRelease
          cp app/build/outputs/apk/full/release/app-full-release.apk PlayTime.apk
          # Install-troubleshooting builds (see README):
          cp app/build/outputs/apk/full/debug/app-full-debug.apk PlayTime-testA-debug.apk
          cp app/build/outputs/apk/noguard/release/app-noguard-release.apk PlayTime-testB-noguard.apk

      # Fails the job if the APK isn't properly signed or can't be read, and logs
      # the package name, SDK levels and signing certificate.
      - name: Verify APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in PlayTime*.apk; do
            echo "=== $apk"
            "$BT/apksigner" verify --verbose --print-certs "$apk"
            "$BT/aapt2" dump badging "$apk" | head -20
            if "$BT/aapt2" dump badging "$apk" | grep -q testOnly; then
              echo "$apk is marked testOnly and would not install"; exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTime-apk
          path: PlayTime*.apk

      # Publish a "latest" release so the APK can be downloaded straight from the
      # phone's browser (no zip).
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-3cd5d074-7tlkgj'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Play Time (latest)
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: "Built from ${{ github.ref_name }} @ ${{ github.sha }}"
          files: PlayTime*.apk
